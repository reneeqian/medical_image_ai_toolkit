[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-ai-toolkit"
version = "0.1.0"
description = "Reusable medical image AI toolkit with regulatory-grade evidence and data contracts"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "forge-utils @ file:///Users/reneeqian/Documents/PythonStuff/Utilities/forge",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requirement(id): Traceability requirement ID",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]