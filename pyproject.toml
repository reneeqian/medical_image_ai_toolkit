[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-ai-toolkit"
version = "0.2.0"
description = "Reusable medical image AI toolkit with regulatory-grade evidence and data contracts"
requires-python = ">=3.10"

dependencies = [
    "numpy==2.2.6",
    "torch==2.13.0",
    "matplotlib==3.10.9",
    "idna==3.18",
    "forge-utils @ git+https://github.com/reneeqian/forge.git@v0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "radon",
    "pip-audit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requirement(id): Traceability requirement ID",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]