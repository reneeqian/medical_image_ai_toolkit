name: Medical Image AI Toolkit Forge Health

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  forge-health:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py311-pip-${{ hashFiles('.github/workflows/forge-health.yml') }}
          restore-keys: |
            ${{ runner.os }}-py311-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch pytest pydicom scipy scikit-image imageio pyyaml pytest-cov matplotlib
          pip install "forge-utils[collectors] @ git+https://github.com/reneeqian/forge.git@v0.2.0"
          pip install "git+https://github.com/reneeqian/regulatory_tools.git@v1.0.0"

      - name: Install project
        run: pip install -e .

      - name: Run forge health assessment
        run: python runtests.py

      - name: Write forge health to job summary
        if: always()
        run: |
          python - <<'EOF'
          import re, pathlib, os
          readme = pathlib.Path("README.md").read_text()
          m = re.search(r"<!-- forge-health-start -->(.*?)<!-- forge-health-end -->", readme, re.DOTALL)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if m and summary_path:
              with open(summary_path, "a") as f:
                  f.write("## Forge Health\n\n" + m.group(1).strip() + "\n")
          EOF
          git checkout README.md

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forge-health-report
          path: |
            docs/traceability_matrix.md
            artifacts/
