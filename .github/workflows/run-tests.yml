name: Medical Image AI Toolkit CI

on:
  push:
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch pytest pydicom scipy scikit-image imageio pyyaml pytest-cov matplotlib
          pip install "git+https://github.com/reneeqian/regulatory_tools.git@dev"

      - name: Install project
        run: pip install -e .

      - name: Run tests
        run: python -m pytest -q
