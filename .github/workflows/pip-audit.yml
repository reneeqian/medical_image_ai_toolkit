name: pip-audit

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit pyyaml
          pip install "forge-utils @ git+https://github.com/reneeqian/forge.git@v0.2.0"
          pip install "git+https://github.com/reneeqian/regulatory_tools.git@v1.0.0"
          pip install -e .

      - name: "Run pip-audit (policy: fail on fixable CVEs, warn on unfixable)"
        run: python .github/scripts/pip_audit_policy.py

      - name: Generate SBOM
        continue-on-error: true
        run: pip-audit --format cyclonedx-json --output sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
