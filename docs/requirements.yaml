metadata:
  project: medical_image_ai_toolkit
  version: 1.0
  description: >
    Deterministic medical image AI training toolkit designed to
    demonstrate regulated software engineering principles.


requirements:

  # ==============================
  # Data Requirements
  # ==============================

  - id: DAT-001
    title: Patient Sample Structure Validation
    description: >
      PatientSample objects shall be structurally validated against
      dimensional, spacing, and identifier constraints via an
      enforceable contract.

  - id: DAT-002
    title: Annotation Structure Compliance
    description: >
      Annotation objects shall expose either:
        (a) a dense mask array, or
        (b) a vector_rois dictionary mapping slice indices to lists of
            VectorROI objects containing (N,2) pixel contours.

  - id: DAT-003
    title: Annotation Boundary Validation
    description: >
      VectorROI contour coordinates and slice indices shall be validated
      against the associated patient volume bounds via contract enforcement.

  - id: DAT-004
    title: Patient Sample Boundary Validation
    description: >
      Patient sample accessors shall prevent out-of-bounds indexing and
      raise defined exceptions when invalid indices are requested.

  - id: DAT-005
    title: Patient Sample To Tensor Conversion
    description: >
      PatientSample objects shall support deterministic conversion to
      2D and 3D tensors while preserving spatial metadata.

  - id: DAT-006
    title: Patient Indexing without Loading
    description: >
      Dataset implementations shall support enumeration of patient
      identifiers without loading full image volumes into memory.

  - id: DAT-007
    title: Dataset Partition Generation
    description: >
      The system shall support generation of training, validation,
      and test dataset partitions from a dataset according to a
      specified partition strategy.

  - id: DAT-008
    title: Deterministic Dataset Partitioning
    description: >
      Dataset partitions generated using identical input datasets,
      configuration parameters, and random seeds shall produce
      identical partition assignments.
  
  - id: DAT-009
    title: Training Tensor Extraction
    description: >
      Dataset ingestor implementations shall expose a deterministic
      interface for converting dataset samples into aligned training
      input and target tensors (X, Y). The returned tensors shall
      maintain consistent dimensional ordering and shall represent
      the learning task defined by the dataset.
    
  - id: DAT-010
    title: Slice-Level Training Data Exposure
    description: >
      Dataset ingestors may expose slice-level training samples derived
      from volumetric patient data. When slice-level training is used,
      the ingestor shall return aligned input and target tensors for
      each slice while maintaining patient-level dataset partitioning.

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Dataset Interface Consistency
    description: >
      All dataset implementations shall expose a consistent callable 
      interface supporting indexed sample retrieval.

  - id: SYS-002
    title: Training Pipeline Orchestration
    description: >
      The system shall support orchestration of dataset preparation,
      model training, and model evaluation as part of a training run.

  - id: SYS-003
    title: Pipeline Configuration Interface
    description: >
      Training pipeline behavior shall be configurable through
      externally supplied configuration parameters.
  
  - id: SYS-004
    title: Training Result Aggregation
    description: >
      The system shall return a structured results object
      containing references to training artifacts,
      evaluation metrics, and model artifacts generated
      during a training run.
  
  # ==============================
  # Training Requirements
  # ==============================

  - id: TRN-001
    title: Configurable Training Execution
    description: >
      Training workflows shall accept externally defined model
      architectures, loss functions, optimizers, and hyperparameters
      through a training configuration object without modification to
      the core training logic.

  - id: TRN-002
    title: Hyperparameter Sweep Support
    description: >
      The system shall support structured execution of multiple training 
      runs across defined hyperparameter configurations.
  
  - id: TRN-003
    title: Training Shall Detect Nan Loss
    description: >
      Training workflows shall detect NaN loss values during optimization and 
      terminate execution with a defined exception.

  - id: TRN-004
    title: Training Run Artifact Generation
    description: >
      Each training run shall generate structured artifacts
      describing the configuration parameters, dataset partitions,
      random seeds, and resulting model artifacts.

  - id: TRN-005
    title: Training Checkpoint Support
    description: >
      The system shall support persistence of intermediate
      model states during training execution.

  - id: TRN-006
    title: Deterministic Training Initialization
    description: >
      Model initialization during training shall be reproducible
      when executed with identical configuration parameters
      and random seeds.
  
  - id: TRN-007
    title: Loss Function Configuration
    description: >
      The training configuration shall define the loss function used
      during model optimization. The training workflow shall compute
      optimization loss using this configured loss function applied
      to the model outputs and dataset targets.
  
  - id: TRN-008
    title: Training Input Interface
    description: >
      Training workflows shall obtain model inputs and targets through
      the dataset datasource interface. Each retrieved sample shall
      return aligned input and target arrays that can be iterated
      during training without additional dataset-specific logic in
      the trainer implementation.
      
  # ==============================
  # Model Requirements
  # ==============================

  - id: MOD-001
    title: Model Optimization Support
    description: >
      The system shall support model training using gradient-based optimization 
      methods configurable via external parameters.

  - id: MOD-002
    title: Artifact Immutability
    description: >
      Persisted training artifacts shall not be modified after initial write and 
      shall be uniquely versioned per training run.
  
  - id: MOD-003
    title: Model Artifact Persistence
    description: >
      The system shall support persistence of trained model
      artifacts in a format suitable for later loading.

  - id: MOD-004
    title: Model Artifact Loading
    description: >
      The system shall support loading previously persisted
      model artifacts for evaluation or further training.
  
  - id: MOD-005
    title: Model Export Support
    description: >
      The system shall support export of trained model artifacts
      in a format suitable for inference or deployment.

  - id: MOD-006
    title: Inference Execution Support
    description: >
      The system shall support execution of model inference
      on new input data using a persisted model artifact.

  # ==============================
  # Verification and Documentation Requirements
  # ==============================

  - id: VER-001
    title: Deterministic Training Behavior
    description: >
      Repeated training runs with identical input data, configuration, and random 
      seeds shall produce identical recorded metrics.

  - id: VER-002
    title: Training Metrics Recording
    description: >
      Training workflows shall record structured per-epoch metrics including loss 
      and any configured evaluation metrics.

  - id: VER-003
    title: Dataset Separation Enforcement
    description: >
      Training and validation datasets shall contain no overlapping sample identifiers.
  
  - id: VER-004
    title: Model Evaluation Execution
    description: >
      The system shall support execution of model evaluation
      workflows using a specified dataset partition.

  - id: VER-005
    title: Evaluation Metric Recording
    description: >
      Model evaluation workflows shall record structured
      evaluation metrics associated with the evaluated model artifact.
  
  - id: VER-006
    title: Post-Training Validation Support
    description: >
      The system shall support execution of validation
      workflows on trained models using held-out datasets.

  - id: VER-007
    title: Inference Consistency Verification
    description: >
      Repeated inference executions using identical model
      artifacts and input data shall produce identical outputs.

# ==============================
# Documentation Requirements
# ==============================

  - id: DOC-001
    title: Machine-Readable Requirements Definition
    description: >
      The project shall include a machine-readable
      requirements.yaml file defining system requirements.
    tags: [documentation]

  - id: DOC-002
    title: Basic Project Documentation
    description: >
      The project shall include a README file describing
      system purpose, configuration, and execution steps.
    tags: [documentation]

  - id: DOC-003
    title: Training Workflow Documentation
    description: >
      Project documentation shall describe the expected workflow
      for dataset preparation, model training, and evaluation
      using the toolkit.
    tags: [documentation]

  - id: DOC-004
    title: Training Report Generation
    description: >
      The system shall support generation of a structured
      training report summarizing training configuration,
      dataset partitions, model artifacts, and evaluation metrics.
    tags: [documentation]