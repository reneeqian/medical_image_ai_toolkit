metadata:
  project: medical_image_ai_toolkit
  version: 1.0
  description: >
    Deterministic medical image AI training toolkit designed to
    demonstrate regulated software engineering principles.


requirements:

  # ==============================
  # Data Requirements
  # ==============================

  - id: DAT-001
    title: Patient Sample Structure Validation
    description: >
      Patient sample objects shall enforce dimensional consistency, 
      spacing metadata integrity, and unique identifier presence upon 
      instantiation.

  - id: DAT-002
    title: Annotation Boundary Validation
    description: >
      Annotation objects shall validate that all spatial coordinates fall 
      within the bounds of the associated patient volume.

  - id: DAT-003
    title: Patient Sample Boundary Validation
    description: >
      Patient sample accessors shall prevent out-of-bounds indexing and 
      raise defined exceptions when invalid indices are requested.
  
  - id: DAT-004
    title: Patient Sample To Tensor Conversion
    description: >
      Patient sample objects shall support deterministic conversion to 2D 
      and 3D tensors with preserved spatial metadata and consistent 
      dimensional ordering.

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Dataset Interface Consistency
    description: >
      All dataset implementations shall expose a consistent callable 
      interface supporting indexed sample retrieval.
    
  # ==============================
  # Training Requirements
  # ==============================

  - id: TRN-001
    title: Configurable Training Execution
    description: >
      Training workflows shall accept externally defined model architectures, 
      optimizers, and hyperparameters without modification to core training logic.

  - id: TRN-002
    title: Hyperparameter Sweep Support
    description: >
      The system shall support structured execution of multiple training 
      runs across defined hyperparameter configurations.
  
  - id: TRN-003
    title: Training Shall Detect Nan Loss
    description: >
      Training workflows shall detect NaN loss values during optimization and 
      terminate execution with a defined exception.

  # ==============================
  # Model Requirements
  # ==============================

  - id: MOD-001
    title: Model Optimization Support
    description: >
      The system shall support model training using gradient-based optimization 
      methods configurable via external parameters.

  - id: MOD-002
    title: Artifact Immutability
    description: >
      Persisted training artifacts shall not be modified after initial write and 
      shall be uniquely versioned per training run.

# ==============================
# Verification and Documentation Requirements
# ==============================

  - id: VER-001
    title: Deterministic Training Behavior
    description: >
      Repeated training runs with identical input data, configuration, and random 
      seeds shall produce identical recorded metrics.

  - id: VER-002
    title: Training Metrics Recording
    description: >
      Training workflows shall record structured per-epoch metrics including loss 
      and any configured evaluation metrics.

  - id: VER-003
    title: Dataset Separation Enforcement
    description: >
      Training and validation datasets shall contain no overlapping sample identifiers.

  - id: DOC-001
    title: Traceability Matrix Generation
    description: >
      The project shall support automated generation of requirement-to-test 
      traceability matrices derived from machine-readable requirement definitions.
