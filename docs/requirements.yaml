metadata:
  project: medical_image_ai_toolkit
  version: 1.0
  description: >
    Reusable medical imaging AI infrastructure with explicit contracts,
    deterministic behavior, and lightweight verification support.


requirements:

  # ==============================
  # Data Requirements
  # ==============================

  - id: DAT-001
    title: Patient Sample Structure Validation
    description: >
      Patient-level data objects shall be validated for required
      structure, identifiers, and basic spatial metadata before use.

  - id: DAT-002
    title: Annotation Structure Compliance
    description: >
      Annotation data shall follow a defined structure so training and
      validation code can consume it consistently.

  - id: DAT-003
    title: Annotation Boundary Validation
    description: >
      Annotation coordinates and slice references shall be checked
      against the associated image volume bounds.

  - id: DAT-004
    title: Patient Sample Boundary Validation
    description: >
      Dataset access APIs shall reject out-of-bounds requests with
      defined exceptions.

  - id: DAT-005
    title: Patient Sample To Tensor Conversion
    description: >
      The toolkit shall support deterministic derivation of model-ready
      inputs from patient-level imaging data.

  - id: DAT-006
    title: Patient Indexing without Loading
    description: >
      Datasets shall support enumeration of patient identifiers without
      requiring full dataset materialization in memory.

  - id: DAT-007
    title: Dataset Partition Generation
    description: >
      The toolkit shall support generation of train, validation, and
      test partitions from a dataset using an external split strategy.

  - id: DAT-008
    title: Deterministic Dataset Partitioning
    description: >
      Partition generation shall be deterministic for identical inputs
      and split configuration.
  
  - id: DAT-009
    title: Training Tensor Extraction
    description: >
      Project-specific code shall be able to expose aligned training
      inputs and targets through stable dataset-facing interfaces.
    
  - id: DAT-010
    title: Slice-Level Training Data Exposure
    description: >
      When slice-level training is used, derived samples shall remain
      aligned with their patient-level dataset membership.

  - id: DAT-011
    title: Dataset Validator Behaviour
    description: >
      DatasetValidator.run() shall iterate all patient IDs, enforce the
      PatientSample contract for each, and aggregate results into a single
      EvidenceReport. Load failures shall be recorded as errors without
      aborting the remaining patients.

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Dataset Interface Consistency
    description: >
      Dataset implementations shall expose a consistent interface for
      enumerating and retrieving patient data.

  - id: SYS-002
    title: Training Pipeline Orchestration
    description: >
      The toolkit shall support orchestration of dataset preparation,
      training, and follow-on evaluation workflows.

  - id: SYS-003
    title: Pipeline Configuration Interface
    description: >
      Training behavior shall be controlled through externally supplied
      configuration rather than hard-coded project policy.
  
  - id: SYS-004
    title: Training Result Aggregation
    description: >
      Training and validation workflows shall return structured results
      objects describing generated artifacts and recorded metrics.

  - id: SYS-005
    title: Explicit Dataset Validation
    description: >
      The toolkit shall support explicit dataset validation and
      structured validation reporting before model training proceeds.
  
  # ==============================
  # Training Requirements
  # ==============================

  - id: TRN-001
    title: Configurable Training Execution
    description: >
      Training workflows shall accept externally supplied models,
      task definitions, optimizers, and hyperparameters.

  - id: TRN-002
    title: Hyperparameter Sweep Support
    description: >
      The toolkit shall allow repeated training execution across
      multiple external configurations.
  
  - id: TRN-003
    title: Training Shall Detect Nan Loss
    description: >
      Training workflows shall detect non-finite optimization loss and
      fail with a defined exception.

  - id: TRN-004
    title: Training Run Artifact Generation
    description: >
      Each training run shall generate structured artifacts capturing
      the run outcome and the artifacts produced.

  - id: TRN-005
    title: Training Checkpoint Support
    description: >
      The toolkit shall support persistence of training state during
      execution when a project requires it.

  - id: TRN-006
    title: Deterministic Training Initialization
    description: >
      Training initialization shall be reproducible when configuration,
      inputs, and random seeds are held constant.
  
  - id: TRN-007
    title: Loss Function Configuration
    description: >
      Training shall compute optimization loss from the task definition
      associated with the current workflow.
  
  - id: TRN-008
    title: Training Input Interface
    description: >
      Training workflows shall consume aligned inputs and targets
      through stable task and dataset interfaces rather than embedding
      dataset-specific logic in the trainer.

  - id: TRN-009
    title: Hyperparameter Space Enumeration
    description: >
      HyperparameterSpace shall enumerate trial configurations from a
      defined parameter grid via full grid search or random sampling,
      and shall report the total number of candidate combinations.

  - id: TRN-010
    title: Cross-Trial Partition Consistency
    description: >
      All trials in a hyperparameter tuning run shall operate on
      identical data partitions to ensure fair comparison across
      trial results.

  - id: TRN-011
    title: Best Trial Identification
    description: >
      The tuning pipeline shall identify and record the best-performing
      trial by validation loss when a validation partition is present,
      or by training loss when validation data is unavailable.

  # ==============================
  # Model Requirements
  # ==============================

  - id: MOD-001
    title: Model Optimization Support
    description: >
      The toolkit shall support gradient-based model optimization using
      externally configured training components.

  - id: MOD-002
    title: Artifact Immutability
    description: >
      Persisted run artifacts shall be written as distinct run outputs
      rather than in-place mutable state.
  
  - id: MOD-003
    title: Model Artifact Persistence
    description: >
      The toolkit shall support persistence of trained model artifacts.

  - id: MOD-004
    title: Model Artifact Loading
    description: >
      Persisted model artifacts shall be usable by downstream
      evaluation or continued training workflows.
  
  - id: MOD-005
    title: Model Export Support
    description: >
      The toolkit shall support export of trained model artifacts in a
      defined serialized form.

  - id: MOD-006
    title: Inference Execution Support
    description: >
      The toolkit shall support inference execution against trained
      model state on new input data.

  # ==============================
  # Verification and Documentation Requirements
  # ==============================

  - id: VER-001
    title: Deterministic Training Behavior
    description: >
      Repeated training runs with identical inputs, configuration, and
      random seeds shall produce identical recorded metrics.

  - id: VER-002
    title: Training Metrics Recording
    description: >
      Training workflows shall record structured metrics for the run.

  - id: VER-003
    title: Dataset Separation Enforcement
    description: >
      Distinct dataset partitions shall not overlap in sample identity.
  
  - id: VER-004
    title: Model Evaluation Execution
    description: >
      The toolkit shall support evaluation workflows over a specified
      dataset partition.

  - id: VER-005
    title: Evaluation Metric Recording
    description: >
      Evaluation workflows shall record structured metrics associated
      with the evaluated model state.
  
  - id: VER-006
    title: Post-Training Validation Support
    description: >
      The toolkit shall support post-training validation on held-out
      data using trained models.

  - id: VER-007
    title: Inference Consistency Verification
    description: >
      Repeated inference with identical model state and inputs shall
      produce identical outputs.

# ==============================
# Documentation Requirements
# ==============================

  - id: DOC-001
    title: Machine-Readable Requirements Definition
    description: >
      The project shall include a machine-readable requirements file.
    tags: [documentation]

  - id: DOC-002
    title: Basic Project Documentation
    description: >
      The project shall include a short README describing purpose,
      boundaries, and intended use.
    tags: [documentation]

  - id: DOC-003
    title: Training Workflow Documentation
    description: >
      Project documentation shall describe the intended role of the
      toolkit without duplicating implementation detail.
    tags: [documentation]

  - id: DOC-004
    title: Training Report Generation
    description: >
      The toolkit shall support generation of structured run reports.
    tags: [documentation]

# ==============================
# Reporting Requirements
# ==============================

  - id: REP-001
    title: Run Report PDF Generation
    description: >
      The toolkit shall provide functions to generate PDF reports for
      training, hyperparameter tuning, and model testing runs. Each PDF
      shall include summary metrics, configuration details, and plots
      derived from existing run artifacts.
    tags: [reporting, visualization]

  - id: REP-002
    title: Run Discovery
    description: >
      Run-report functions shall accept an optional run_id and default to
      the most recent run when no ID is provided. A FileNotFoundError
      shall be raised when no matching runs exist.
    tags: [reporting]
